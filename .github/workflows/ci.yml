name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 ollama_server tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Line length is set to 100 chars.
        flake8 ollama_server tests --count --exit-zero --max-complexity=10 \
          --max-line-length=100 --statistics

    - name: Check code formatting with black
      run: |
        black --check --line-length=100 ollama_server tests

    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black ollama_server tests

    - name: Type checking with mypy
      run: |
        mypy ollama_server tests --ignore-missing-imports --check-untyped-defs

    - name: Test with pytest
      run: |
        python -m pytest tests/ --cov=ollama_server --cov-branch --cov-report=xml \
          --cov-report=term-missing --cov-fail-under=20

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.2
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint-configs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate YAML files
      run: |
        sudo apt-get update
        sudo apt-get install -y yamllint
        find . -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 \
          | xargs -0 -r yamllint -d relaxed

    - name: Check shell scripts
      run: |
        sudo apt-get install -y shellcheck
        find . -type f -name "*.sh" -print0 | xargs -0 -r shellcheck

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Audit Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --requirement requirements-dev.txt
        pip-audit --requirement requirements.txt

    - name: Run bandit security linter
      run: |
        bandit -r ollama_server -lll -f json -o bandit-report.json

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: bandit-report
        path: bandit-report.json
        if-no-files-found: error
